<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek Harness</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at center, #161b22 0%, #0d1117 100%);
      color: #f0f6fc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
    }
    .logo-wrapper {
      position: relative;
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-glow {
      position: absolute;
      width: 110px;
      height: 110px;
      background: radial-gradient(circle, rgba(77, 107, 254, 0.4) 0%, rgba(77, 107, 254, 0) 70%);
      border-radius: 50%;
      animation: pulse 2s infinite ease-in-out;
    }
    .logo {
      width: 80px;
      height: 80px;
      z-index: 2;
      filter: drop-shadow(0 4px 12px rgba(77, 107, 254, 0.5));
    }
    .title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
    }
    .subtitle {
      font-size: 13px;
      color: #8b949e;
      margin-top: -12px;
    }
    .spinner {
      margin-top: 10px;
      width: 28px;
      height: 28px;
      border: 3px solid rgba(77, 107, 254, 0.15);
      border-top: 3px solid #4d6bfe;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    .status {
      font-size: 12px;
      color: #58a6ff;
      font-weight: 500;
      min-height: 18px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.9); opacity: 0.5; }
      50% { transform: scale(1.15); opacity: 0.9; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrapper">
      <div class="logo-glow"></div>
      <img class="logo" src="../build/icon.png" alt="DeepSeek Harness">
    </div>
    <div class="title">DeepSeek Harness</div>
    <div class="subtitle">Agent Harness Platform</div>
    <div class="spinner"></div>
    <div class="status" id="status-text">Iniciando servidor local...</div>
  </div>

  <script>
    const statusEl = document.getElementById('status-text');
    const messages = [
      'Iniciando servidor local...',
      'Carregando plugins do Cordis...',
      'Preparando interface web...'
    ];
    let idx = 0;
    setInterval(() => {
      idx = (idx + 1) % messages.length;
      statusEl.textContent = messages[idx];
    }, 1500);
  </script>
</body>
</html>
