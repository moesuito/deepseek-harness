<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek Harness</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #0b0d13;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
    }
    .logo-container {
      position: relative;
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-glow {
      position: absolute;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(77, 107, 254, 0.25) 0%, rgba(77, 107, 254, 0) 70%);
      animation: pulse 2.4s infinite ease-in-out;
    }
    .logo {
      width: 56px;
      height: 56px;
      z-index: 1;
      filter: drop-shadow(0 2px 8px rgba(77, 107, 254, 0.35));
    }
    .header {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .title {
      font-size: 19px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: #ffffff;
    }
    .subtitle {
      font-size: 12px;
      color: #7d8590;
      font-weight: 400;
    }
    .progress-bar-container {
      width: 130px;
      height: 2px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      margin-top: 6px;
    }
    .progress-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, transparent, #4d6bfe, #79c0ff, transparent);
      border-radius: 999px;
      animation: indeterminate 1.6s infinite ease-in-out;
    }
    .status {
      font-size: 11px;
      color: #8b949e;
      font-weight: 400;
      letter-spacing: 0.1px;
      min-height: 16px;
      transition: opacity 0.2s ease;
    }
    @keyframes indeterminate {
      0% { left: -40%; width: 30%; }
      50% { left: 40%; width: 50%; }
      100% { left: 100%; width: 30%; }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.95); opacity: 0.4; }
      50% { transform: scale(1.15); opacity: 0.85; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="logo-container">
      <div class="logo-glow"></div>
      <img class="logo" src="../build/icon.png" alt="DeepSeek">
    </div>
    <div class="header">
      <div class="title">DeepSeek Harness</div>
      <div class="subtitle">Agent Platform</div>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar-fill"></div>
    </div>
    <div class="status" id="status-text">Starting local runtime...</div>
  </div>

  <script>
    const statusEl = document.getElementById('status-text');
    const messages = [
      'Starting local runtime...',
      'Loading Cordis plugins...',
      'Preparing workspace...'
    ];
    let idx = 0;
    setInterval(() => {
      idx = (idx + 1) % messages.length;
      statusEl.style.opacity = '0';
      setTimeout(() => {
        statusEl.textContent = messages[idx];
        statusEl.style.opacity = '1';
      }, 200);
    }, 1600);
  </script>
</body>
</html>
